[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: multi-agent AML investigation on LangGraph"
requires-python = ">=3.11"

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinel.prompts" = ["*.md"]
"sentinel.datagen" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# deepeval's auto-loaded pytest plugin imports langchain.schema, removed in LangChain 1.x
# Default run is offline; `pytest -m integration` / `pytest -m live` select the others.
addopts = "-p no:plugins -m 'not integration and not live'"
pythonpath = ["."]  # makes mcp_servers/ importable in tests
markers = [
    "live: calls AWS Bedrock; run with SENTINEL_LIVE=1",
    "integration: needs the Docker stack (docker compose up -d --build)",
]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["ui", "data", "observability"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI dependencies (Depends) are defaults by design
    "B023",  # closures in loops are called within the same iteration
    "B905", "E741", "SIM102", "SIM105", "SIM117",  # style only
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
