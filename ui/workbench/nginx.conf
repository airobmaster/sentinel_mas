# Workbench container: static app + /api proxied to the API (server-sent events need buffering off).
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;          # live progress (SSE) must not be held back
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: every other path (e.g. /cases/CASE-0001, /callback) serves index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
