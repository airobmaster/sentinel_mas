name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt -e .
      - name: Lint
        run: ruff check .
      - name: Types (report only until the existing findings are cleared)
        run: mypy src
        continue-on-error: true
      - name: Synthetic dataset (seeded)
        run: sentinel data generate
      - name: Unit tests (offline)
        run: pytest -q

  policies:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - run: opa test guardrails/opa -v

  workbench:
    name: Workbench build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/workbench/package-lock.json
      - run: npm ci
      - run: npm run build
