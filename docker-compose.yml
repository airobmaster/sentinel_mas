# Sentinel local stack: Postgres, Kafka (+ UI), OPA and the MCP tool servers.
#   docker compose up -d --build
#   sentinel data generate && sentinel data load && sentinel kafka init
#   sentinel worker all                                 (agents run on the host, see README)
# Airflow, Neo4j and observability services are added in later slices.
name: sentinel

x-mcp-server: &mcp-server
  build:
    context: .
    dockerfile: mcp_servers/Dockerfile
  image: sentinel-mcp:dev
  environment:
    SENTINEL_DATA_BACKEND: postgres
    SENTINEL_PG_DSN: postgresql://sentinel:sentinel@postgres:5432/sentinel
    SENTINEL_MCP_DEV_SECRET: ${SENTINEL_MCP_DEV_SECRET:-dev-only-signing-key-not-for-production}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created by `sentinel kafka init`
    ports: ["9092:9092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinel-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports: ["8080:8080"]
    depends_on:
      kafka:
        condition: service_healthy

  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--log-level", "info", "/policies"]
    volumes: ["./guardrails/opa:/policies:ro"]
    ports: ["8181:8181"]

  mcp-case-mgmt:
    <<: *mcp-server
    command: ["case_mgmt"]
    ports: ["8101:8000"]

  mcp-kyc-profile:
    <<: *mcp-server
    command: ["kyc_profile"]
    ports: ["8102:8000"]

  mcp-txn-history:
    <<: *mcp-server
    command: ["txn_history"]
    ports: ["8103:8000"]

  mcp-screening:
    <<: *mcp-server
    command: ["screening"]
    ports: ["8104:8000"]

volumes:
  pgdata:
  kafkadata:
