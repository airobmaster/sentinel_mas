# Sentinel local stack: Postgres, Kafka (+ UI), OPA, Presidio, the MCP tool servers, the API and Airflow.
#   docker compose up -d --build
#   sentinel data generate && sentinel data load && sentinel kafka init
#   sentinel worker all                                 (agents run on the host, see README)
# Neo4j runs in Neo4j Desktop on the host; observability services come in a later slice.
name: sentinel

x-mcp-server: &mcp-server
  build:
    context: .
    dockerfile: mcp_servers/Dockerfile
  image: sentinel-mcp:dev
  environment:
    SENTINEL_DATA_BACKEND: postgres
    SENTINEL_PG_DSN: postgresql://sentinel:sentinel@postgres:5432/sentinel
    SENTINEL_MCP_DEV_SECRET: ${SENTINEL_MCP_DEV_SECRET:-dev-only-signing-key-not-for-production}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created by `sentinel kafka init`
    ports: ["9092:9092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinel-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports: ["8080:8080"]
    depends_on:
      kafka:
        condition: service_healthy

  presidio:
    # PII detection (spaCy en_core_web_lg) as a service; models only ever see redaction tokens
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports: ["5002:3000"]

  opa:
    image: openpolicyagent/opa:latest
    # --watch reloads tools.rego / data.json when they change, so the running allow-list never goes stale
    command: ["run", "--server", "--watch", "--addr", "0.0.0.0:8181", "--log-level", "info", "/policies"]
    volumes: ["./guardrails/opa:/policies:ro"]
    ports: ["8181:8181"]

  mcp-case-mgmt:
    <<: *mcp-server
    command: ["case_mgmt"]
    ports: ["8101:8000"]

  mcp-kyc-profile:
    <<: *mcp-server
    command: ["kyc_profile"]
    ports: ["8102:8000"]

  mcp-txn-history:
    <<: *mcp-server
    command: ["txn_history"]
    ports: ["8103:8000"]

  mcp-screening:
    <<: *mcp-server
    command: ["screening"]
    ports: ["8104:8000"]

  mcp-graph-query:
    <<: *mcp-server
    command: ["graph_query"]
    ports: ["8105:8000"]
    environment:
      SENTINEL_DATA_BACKEND: postgres
      SENTINEL_PG_DSN: postgresql://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_MCP_DEV_SECRET: ${SENTINEL_MCP_DEV_SECRET:-dev-only-signing-key-not-for-production}
      # Neo4j runs on the host (Neo4j Desktop). bolt:// avoids routing to the host's 127.0.0.1.
      SENTINEL_NEO4J_URI: ${SENTINEL_NEO4J_CONTAINER_URI:-bolt://host.docker.internal:7687}
      SENTINEL_NEO4J_USER: ${SENTINEL_NEO4J_USER:-neo4j}
      SENTINEL_NEO4J_PASSWORD: ${SENTINEL_NEO4J_PASSWORD:-}

  mcp-policy-kb:
    <<: *mcp-server
    command: ["policy_kb"]
    ports: ["8106:8000"]
    environment:
      SENTINEL_DATA_BACKEND: postgres
      SENTINEL_PG_DSN: postgresql://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_MCP_DEV_SECRET: ${SENTINEL_MCP_DEV_SECRET:-dev-only-signing-key-not-for-production}
      SENTINEL_AWS_REGION: ${SENTINEL_AWS_REGION:-eu-west-2}
      AWS_REGION: ${SENTINEL_AWS_REGION:-eu-west-2}
    # Dev only: query embeddings use your local AWS login. On AWS the task role provides credentials.
    volumes: ["${USERPROFILE:-${HOME}}/.aws:/home/mcp/.aws"]

  # Sentinel API (http://localhost:8000/docs). Reads Postgres and the checkpointer; publishes to Kafka.
  # Auth: Cognito when SENTINEL_AUTH_MODE=cognito in .env (token checks need no AWS credentials), else dev tokens.
  api:
    build: { context: ., dockerfile: docker/sentinel.Dockerfile }
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SENTINEL_PG_DSN: postgresql://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_KAFKA_BOOTSTRAP: kafka:29092
      SENTINEL_AWS_REGION: ${SENTINEL_AWS_REGION:-eu-west-2}
      SENTINEL_AUTH_MODE: ${SENTINEL_AUTH_MODE:-dev}
      SENTINEL_COGNITO_USER_POOL_ID: ${SENTINEL_COGNITO_USER_POOL_ID:-}
      SENTINEL_COGNITO_TOOLS_CLIENT_ID: ${SENTINEL_COGNITO_TOOLS_CLIENT_ID:-}
      SENTINEL_COGNITO_WORKBENCH_CLIENT_ID: ${SENTINEL_COGNITO_WORKBENCH_CLIENT_ID:-}
      SENTINEL_COGNITO_DOMAIN: ${SENTINEL_COGNITO_DOMAIN:-}
      SENTINEL_API_DEV_SECRET: ${SENTINEL_API_DEV_SECRET:-dev-only-api-signing-key-not-for-production}
      SENTINEL_BLIND_MODE_PERCENT: ${SENTINEL_BLIND_MODE_PERCENT:-20}
      SENTINEL_OTEL_ENDPOINT: http://otel-collector:4318
      # Local demo only: the workbench's role dropdown signs in as each test user (passwords from .env)
      SENTINEL_DEMO_ROLE_SWITCH: ${SENTINEL_DEMO_ROLE_SWITCH:-true}
      SENTINEL_COGNITO_TEST_USERS: ${SENTINEL_COGNITO_TEST_USERS:-{}}
      # Network graph view: the same Neo4j as the agents (Neo4j Desktop on the host)
      SENTINEL_DATA_BACKEND: postgres
      SENTINEL_NEO4J_URI: ${SENTINEL_NEO4J_URI_DOCKER:-bolt://host.docker.internal:7687}
      SENTINEL_NEO4J_USER: ${SENTINEL_NEO4J_USER:-neo4j}
      SENTINEL_NEO4J_PASSWORD: ${SENTINEL_NEO4J_PASSWORD:-}

  # Investigator workbench (http://localhost:5173, the sign-in callback registered with Cognito).
  # For UI development stop it (docker compose stop workbench) and run `npm run dev` in ui/workbench.
  workbench:
    build: { context: ui/workbench, dockerfile: ../../docker/workbench.Dockerfile }
    ports: ["5173:80"]
    depends_on: [api]
    restart: unless-stopped

  # Airflow 3 (http://localhost:8088): batch jobs in ingestion/airflow/dags. Metadata in the `airflow`
  # database of the same Postgres, created once by airflow-db.
  airflow-db:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["sh", "-c", "psql postgresql://sentinel:sentinel@postgres:5432/sentinel -tAc \"SELECT 1 FROM pg_database WHERE datname = 'airflow'\" | grep -q 1 || psql postgresql://sentinel:sentinel@postgres:5432/sentinel -c 'CREATE DATABASE airflow'"]
    restart: "no"

  airflow:
    build: { context: ., dockerfile: docker/airflow.Dockerfile }
    command: standalone
    ports: ["8088:8080"]
    depends_on:
      airflow-db: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sentinel:sentinel@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"  # local only: no Airflow login
      # Sentinel CLI used by the tasks (data and evals mounted below)
      SENTINEL_HOME: /opt/sentinel-home
      SENTINEL_OTEL_ENDPOINT: http://otel-collector:4318
      SENTINEL_DATA_BACKEND: postgres
      SENTINEL_PG_DSN: postgresql://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_KAFKA_BOOTSTRAP: kafka:29092
      SENTINEL_NEO4J_URI: ${SENTINEL_NEO4J_URI_DOCKER:-bolt://host.docker.internal:7687}
      SENTINEL_NEO4J_USER: ${SENTINEL_NEO4J_USER:-neo4j}
      SENTINEL_NEO4J_PASSWORD: ${SENTINEL_NEO4J_PASSWORD:-}
      SENTINEL_AWS_REGION: ${SENTINEL_AWS_REGION:-eu-west-2}
      AWS_REGION: ${SENTINEL_AWS_REGION:-eu-west-2}
    volumes:
      - ./ingestion/airflow/dags:/opt/airflow/dags
      - ./data:/opt/sentinel-home/data:ro
      - ./evals:/opt/sentinel-home/evals
      # Dev only: policy_reembed uses your local AWS login. On AWS the task role provides credentials.
      - ${USERPROFILE:-${HOME}}/.aws:/home/airflow/.aws
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 90s
    restart: unless-stopped

  # --- Observability: traces (OTel collector -> Tempo), metrics (Prometheus), dashboards (Grafana) ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [tempo]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo.yaml:ro", "tempodata:/var/tempo"]
    ports: ["3200:3200"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    restart: unless-stopped

  # Grafana at http://localhost:3000 (no login locally): Sentinel dashboards + Tempo trace search
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo]
    restart: unless-stopped

volumes:
  tempodata:
  pgdata:
  kafkadata:
