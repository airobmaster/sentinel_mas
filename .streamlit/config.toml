# Streamlit settings for the Sentinel test console (read when Streamlit runs from the repo root).
[theme]
base = "light"
primaryColor = "#0F4C81"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F9"
textColor = "#1B2430"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
