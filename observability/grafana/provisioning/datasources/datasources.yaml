apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      tracesToMetrics: { datasourceUid: prometheus }
      serviceMap: { datasourceUid: prometheus }
  - name: Sentinel cases
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: sentinel
    secureJsonData: { password: sentinel }
    jsonData: { database: sentinel, sslmode: disable, postgresVersion: 1600 }
